services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inframanager
      POSTGRES_PASSWORD: inframanager
      POSTGRES_DB: inframanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inframanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://inframanager:inframanager@db:5432/inframanager
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ["full"]
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
